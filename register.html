<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>

  <!-- External css -->
  <link rel="stylesheet" href="CSS/style.css" />
  <!-- <link rel="stylesheet" href="CSS/form.css"> -->

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" crossorigin="anonymous" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="max-width: 450px; width:100%;">
    <div class="text-center mb-4">
      <i class="fa-solid fa-user-plus fa-3x text-success mb-2"></i>
      <h2 class="mb-2">Create Account</h2>
      <p class="text-muted">Register to get started</p>
    </div>
    <form id="registerForm">
      
      <!-- Name -->
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your full name" >
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="example@mail.com" >
        <div id="emailMsg" class="form-text"></div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control" placeholder="Enter password" >
          <button type="button" id="togglePass" class="btn btn-outline-secondary">
            <i class="fa-solid fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" >
        <div id="confirmMsg" class="form-text"></div>
      </div>

      <button type="submit" class="btn btn-success w-100">Register</button>

      <div class="text-center mt-3">
        <small>Already have an account? <a href="index.html" class="text-decoration-none">Login</a></small>
      </div>
    </form>
  </div>
</div>

<!-- JS -->
<script src="JS/regiser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
